<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Core Relic — Damage States</title>
<style>html,body{margin:0;height:100%;background:#1a1426;overflow:hidden;font:14px monospace;color:#ddd}
#c{width:100%;height:100%;display:block}#hud{position:absolute;left:12px;top:10px}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">models/core/core.glb — red: pristine, cracked, leaking, shattered — then blue (mirrored) at right. ?zoom=N</div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script>
// Dev viewer for the Blender-built core relic (tools/blender/build_jar.py). Same camera as the game:
// orthographic ArcRotate alpha=-PI/2, beta=PI/3 (30 deg above the ground, looking along +Z).
// Material treatment here is what the game will apply by name (glass/brine translucency + glows).
const canvas = document.getElementById('c');
const engine = new BABYLON.Engine(canvas, false);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.10, 0.08, 0.15, 1);
const zoom = parseFloat(new URLSearchParams(location.search).get('zoom') || '1');
const cam = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, Math.PI / 3, 60, new BABYLON.Vector3(0, 3, 0), scene);
cam.mode = BABYLON.Camera.ORTHOGRAPHIC_CAMERA;
cam.attachControl(canvas, true);
const fit = () => {
  const aspect = engine.getRenderWidth() / engine.getRenderHeight();
  const half = Math.max(9, 32 / aspect) / zoom;   // all five placements fit the width
  cam.orthoTop = half; cam.orthoBottom = -half; cam.orthoLeft = -half * aspect; cam.orthoRight = half * aspect;
};
fit();
new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0, 1, 0), scene).intensity = 0.75;
const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(0.4, -1, 0.6), scene);
sun.intensity = 0.9; sun.diffuse = new BABYLON.Color3(1.0, 0.92, 0.76);
const ground = BABYLON.MeshBuilder.CreateGround('g', { width: 160, height: 30 }, scene);
const gm = new BABYLON.StandardMaterial('gm', scene); gm.diffuseColor = new BABYLON.Color3(0.35, 0.3, 0.22);
gm.specularColor = BABYLON.Color3.Black(); ground.material = gm;
new BABYLON.GlowLayer('glow', scene).intensity = 0.35;

const TEAM = { blue: new BABYLON.Color3(0.35, 0.5, 1.0), red: new BABYLON.Color3(1.0, 0.42, 0.33) };
const JUICE = { blue: new BABYLON.Color3(0.15, 0.4, 1.0), red: new BABYLON.Color3(1.0, 0.16, 0.1) };   // saturated
const styleMat = (t, team) => {
  t.metallic = 0; t.roughness = 1; t.environmentIntensity = 0;
  if (t.albedoTexture) t.albedoTexture.updateSamplingMode(BABYLON.Texture.NEAREST_NEAREST_MIPLINEAR);
  const n = t.name.split('#')[0];
  if (/_team$/.test(n)) t.albedoColor = TEAM[team];
  if (n === 'M_glass') { t.alpha = 0.2; t.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
                         t.backFaceCulling = false; t.emissiveColor = new BABYLON.Color3(0.06, 0.12, 0.08); }
  if (n === 'M_brine_team') { t.alpha = 0.62; t.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
                              t.albedoColor = JUICE[team]; t.emissiveColor = JUICE[team].scale(0.6);
                              t.backFaceCulling = true; }   // the defending team's juice
  if (n === 'M_pickle') t.emissiveColor = new BABYLON.Color3(0.05, 0.12, 0.01);   // lit a little by the juice
  if (n === 'M_rune') t.emissiveColor = new BABYLON.Color3(0.45, 1.0, 0.3);
  if (n === 'M_flame') t.emissiveColor = new BABYLON.Color3(1.0, 0.7, 0.3);
  if (n === 'M_crack') {   // additive: the fracture only brightens what's behind it (light glinting in the glass)
    t.backFaceCulling = false; t.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND;
    t.alphaMode = BABYLON.Engine.ALPHA_ADD; t.alpha = 0.22;
    t.albedoColor = new BABYLON.Color3(0.2, 0.22, 0.21); t.emissiveColor = new BABYLON.Color3(0.22, 0.25, 0.24);
  }
};
const place = async (x, state, team, mirror) => {
  const res = await BABYLON.SceneLoader.ImportMeshAsync('', 'models/core/', 'core.glb?t=' + Date.now(), scene);
  const root = res.meshes[0];
  root.position.x = x;
  if (mirror) root.scaling.x *= -1;
  res.transformNodes.concat(res.meshes).forEach(n => {
    const m = /^core_s(\d)$/.exec(n.name);
    if (m) n.setEnabled(+m[1] === state);
    if (n.name === 'core_debris') n.setEnabled(false);
  });
  res.meshes.forEach(mesh => {
    const mat = mesh.material; if (!mat) return;
    const t = mat.clone(mat.name + '#' + team + x); mesh.material = t;
    styleMat(t, team);
  });
};
(async () => {
  // Red is the defender here: the relic sits on the right end of the lane, mirrored like the red castle.
  for (let s = 0; s < 4; s++) await place(-26 + s * 12.5, s, 'red', true);
  await place(28, 0, 'blue', false);
})();
engine.runRenderLoop(() => scene.render());
window.addEventListener('resize', () => { engine.resize(); fit(); });
</script>
</body>
</html>
